<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manik Bajaj | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans leading-normal">

    <!-- Header / Hero Section -->
    <header class="max-w-5xl mx-auto p-8 text-center border-b border-slate-800">
        <h1 id="user-name" class="text-4xl font-extrabold text-blue-400">Manik Bajaj</h1>
        <p id="user-title" class="text-xl text-slate-400 mt-2">Software Developer</p>
        <div class="flex justify-center gap-6 mt-4 text-sm text-slate-300">
            <a id="email-link" href="#" class="hover:text-blue-400 transition"><i class="fa fa-envelope mr-1"></i> Email</a>
            <a id="phone-link" href="#" class="hover:text-blue-400 transition"><i class="fa fa-phone mr-1"></i> Phone</a>
            <a id="github-link" href="#" target="_blank" class="hover:text-blue-400 transition"><i class="fab fa-github mr-1"></i> GitHub</a>
            <a id="linkedin-link" href="#" target="_blank" class="hover:text-blue-400 transition"><i class="fab fa-linkedin mr-1"></i> LinkedIn</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 space-y-8">
        
        <!-- Skills Section -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-2xl font-bold text-blue-400 mb-4"><i class="fa fa-code mr-2"></i>Technical Skills</h2>
            <div id="skills-container" class="space-y-3"></div>
        </section>

        <!-- Experience Section -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-2xl font-bold text-blue-400 mb-4"><i class="fa fa-briefcase mr-2"></i>Experience</h2>
            <div id="experience-container" class="space-y-4"></div>
        </section>

        <!-- Projects Section -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-2xl font-bold text-blue-400 mb-4"><i class="fa fa-laptop-code mr-2"></i>Featured Projects</h2>
            <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- Certifications & Education Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Certifications -->
            <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <h2 class="text-2xl font-bold text-blue-400 mb-4"><i class="fa fa-certificate mr-2"></i>Certifications</h2>
                <ul id="certifications-container" class="space-y-3"></ul>
            </section>

            <!-- Education -->
            <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <h2 class="text-2xl font-bold text-blue-400 mb-4"><i class="fa fa-graduation-cap mr-2"></i>Education</h2>
                <div id="education-container" class="space-y-4"></div>
            </section>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
